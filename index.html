const FARMACOS={"Flúor-18 (¹⁸F)":109.77,"Gálio-68 (⁶⁸Ga)":67.71,"Carbono-11 (¹¹C)":20.39,"Nitrogênio-13 (¹³N)":9.97,"Oxigênio-15 (¹⁵O)":2.04,"Outro":110};
const UPTAKE=60;
const CFG0={farmaco:"Flúor-18 (¹⁸F)",mvCustom:"109.77",perda:"4",hCalib:"08:00",aCalib:"",vCalib:"",lote:"",uptake:60,intervalo:25,duracaoExame:25,instituicao:"",fMin:"0.08",fMax:"0.12"};

const getT12=(f,mv)=>f==="Outro"?(parseFloat(mv)||110):(FARMACOS[f]||109.77);
const toMin=t=>{if(!t||!t.includes(':'))return 0;const[h,m]=t.split(":").map(Number);return(h||0)*60+(m||0);};
const minsToTime=m=>{let v=m;if(v<0)v+=1440;return`${String(Math.floor(v/60)%24).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;};
const addMin=(t,d)=>minsToTime(toMin(t)+d);
const decair=(a,t12,dt)=>a*Math.pow(2,-dt/t12);
const f1=v=>(v==null||isNaN(v))?"—":(Math.abs(v)<0.05?0:v).toFixed(1);
const mbq=v=>isNaN(v)?"—":(v*37).toFixed(0);
const nowt=()=>{const n=new Date();return`${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;};
const dataHoje=()=>new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
let _vib=true;
const vib=()=>_vib&&navigator.vibrate&&navigator.vibrate(30);

const horaValida=t=>{
  if(typeof t!=='string'||!/^\d{2}:\d{2}$/.test(t))return false;
  const[h,m]=t.split(':').map(Number);
  return h>=0&&h<24&&m>=0&&m<60;
};
const temDoseRegistrada=p=>!isNaN(parseFloat(p&&p.doseReal))&&parseFloat(p.doseReal)>0;
// hSim permanece como horário previsto. Depois do registro, os cálculos físicos
// usam hInjReal; registros antigos sem esse campo continuam compatíveis, mas são
// identificados na interface como estimados a partir do horário previsto.
const horaInjecaoEfetiva=p=>temDoseRegistrada(p)&&horaValida(p.hInjReal)?p.hInjReal:p.hSim;
const horaEntradaSala=(p,uptake)=>addMin(horaInjecaoEfetiva(p),Number(uptake)||UPTAKE);
const horaTerminoExame=(p,uptake,duracao)=>addMin(horaEntradaSala(p,uptake),Number(duracao)||25);

const getRelMin=(time,ref)=>{
  let mTime=typeof time==='string'?toMin(time):time;
  let mRef=typeof ref==='string'?toMin(ref):ref;
  let m=mTime-mRef;
  // Só envolve na virada de meia-noite (valor fortemente negativo).
  // Eventos posteriores à referência em até 23h permanecem positivos,
  // evitando o wrap incorreto em plantões longos (>12h).
  if(m<-180)m+=1440;
  return m;
};

// Ao editar manualmente o horário de um paciente, os pacientes agendados
// DEPOIS dele acompanham a mudança pelo mesmo deslocamento (delta), preservando
// o intervalo entre eles. Pacientes já injetados (com dose real registrada)
// permanecem fixos como âncoras.
function cascataHorario(lista, hCalib, id, novoHorario){
  const alvo = lista.find(x=>x.id===id);
  if(!alvo) return lista;
  const delta = toMin(novoHorario) - toMin(alvo.hSim);
  const refAlvo = getRelMin(alvo.hSim, hCalib);
  return lista.map(x=>{
    if(x.id===id) return {...x, hSim:novoHorario};
    if(delta===0) return x;
    const jaInjetado = !isNaN(parseFloat(x.doseReal)) && parseFloat(x.doseReal) > 0;
    if(jaInjetado) return x;
    if(getRelMin(x.hSim, hCalib) > refAlvo) return {...x, hSim: addMin(x.hSim, delta)};
    return x;
  });
}

function recalc(lista, ac, vc, hC, t12, perda, fMinG, fMaxG) {
  let cA = parseFloat(ac) || 0;
  let calcList = [...lista].sort((a, b) => getRelMin(horaInjecaoEfetiva(a), hC) - getRelMin(horaInjecaoEfetiva(b), hC));
  let fatorPerda = 1 - perda / 100;

  let lc = calcList.map(p => {
    const w = parseFloat(p.peso) || 0;
    const fmn = parseFloat(p.fMin) || fMinG;
    const fmx = parseFloat(p.fMax) || fMaxG;
    const dPmin = w * fmn, dPmax = w * fmx;
    let dt = Math.max(getRelMin(horaInjecaoEfetiva(p), hC), 0);
    let dec = Math.pow(0.5, dt / t12);
    return { ...p, dPmin, dPmax, dt, dec, doseAplicar: 0, guilhotina: false, doseRealExistente: 0 };
  });

  let pool = cA;
  let pendentes = [];
  
  for (let p of lc) {
    if (!isNaN(parseFloat(p.doseReal)) && parseFloat(p.doseReal) > 0) {
      pool -= (parseFloat(p.doseReal) / fatorPerda) / p.dec;
      p.doseAplicar = parseFloat(p.doseReal);
    } else {
      pendentes.push(p);
    }
  }

  let sobreviventes = [];
  let tempPool = pool;
  
  for (let p of pendentes) {
    let reqMinPool = (p.dPmin / fatorPerda) / p.dec;
    // Paciente sem dose mínima válida (peso vazio/zero) não pode ser
    // tratado como atendível por padrão: exige dPmin > 0.
    if (p.dPmin > 0 && tempPool >= reqMinPool) {
      sobreviventes.push(p);
      tempPool -= reqMinPool; 
    } else {
      p.guilhotina = true;
      p.doseRealExistente = (Math.max(tempPool, 0) * p.dec) * fatorPerda;
      tempPool = 0; 
    }
  }

  let reqMinTotal = sobreviventes.reduce((s, p) => s + (p.dPmin / fatorPerda) / p.dec, 0);
  let surplusPool = pool - reqMinTotal; 

  let reqExtraMaxTotal = 0;
  for (let p of sobreviventes) {
    let extraMax = Math.max(p.dPmax - p.dPmin, 0);
    p.extraReqFull = (extraMax / fatorPerda) / p.dec;
    reqExtraMaxTotal += p.extraReqFull;
  }

  let P = reqExtraMaxTotal > 0 ? Math.min(1, surplusPool / reqExtraMaxTotal) : 0;
  for (let p of sobreviventes) {
    let extraMax = Math.max(p.dPmax - p.dPmin, 0);
    p.doseAplicar = p.dPmin + (P * extraMax);
  }

  let atvCorrente = cA;
  let tA = hC;
  for (let p of lc) {
    const hInjecao=horaInjecaoEfetiva(p);
    let dtPasso = Math.max(getRelMin(hInjecao, tA), 0);
    atvCorrente = decair(atvCorrente, t12, dtPasso);
    p.disp = atvCorrente;
    // Teto REAL da dose para este paciente: além do limite por peso (dPmax),
    // limita-se ao que o frasco realmente permite injetar neste horário
    // (atividade disponível descontada a perda de seringa). Sem dados do frasco
    // (cA<=0) mantém-se o teto clínico por peso.
    p.dPmaxReal = cA > 0 ? Math.max(0, Math.min(p.dPmax, atvCorrente * fatorPerda)) : p.dPmax;

    if (p.guilhotina) {
      p.doseAplicar = 0;
    } else {
      let usoFrasco = p.doseAplicar / fatorPerda;
      atvCorrente = atvCorrente - usoFrasco;
      p.isConstrained = (p.doseAplicar < p.dPmax - 0.05 && p.doseAplicar > 0);
    }
    tA = hInjecao;
  }

  const atvFinal = atvCorrente;
  return { lista: lc, atvFinal };
}

/* Limite exibido acima da dose programada.
   A janela clínica por peso continua disponível no tooltip, mas o valor visível
   não sugere aspirar mais do que a distribuição atual reservou para o paciente.
   Para uma dose já registrada, volta a mostrar o máximo clínico, evitando uma
   faixa invertida quando a dose real ficou abaixo do mínimo. */
const tetoSugerido=(p,temReal)=>{
  if(temReal){
    const salvo=parseFloat(p.doseReferencia);
    return salvo>0?Math.min(p.dPmax,salvo):p.dPmax;
  }
  return Math.min(p.dPmax,p.doseAplicar);
};

/* Ao registrar a primeira dose real, congela a referência visual e registra o
   horário real. Ele pode ser corrigido manualmente. Ao apagar a dose, ambos os
   registros factuais são removidos. */
function atualizacaoDoseReal(p,valor){
  const real=parseFloat(valor);
  if(real>0){
    const salva=parseFloat(p.doseReferencia);
    return{doseReal:valor,doseReferencia:salva>0?salva:tetoSugerido(p,false),hInjReal:horaValida(p.hInjReal)?p.hInjReal:nowt()};
  }
  return{doseReal:valor,doseReferencia:"",hInjReal:""};
}

/* Uma dose registrada representa um fato físico: a calibração não pode ser
   movida para depois dela. A comparação usa a calibração anterior como
   referência para não sofrer a conversão de meia-noite de getRelMin. */
function doseRegistradaAntesDe(lista,hRef,hNova){
  const limite=getRelMin(hNova,hRef);
  return lista.find(p=>temDoseRegistrada(p)
    &&getRelMin(horaInjecaoEfetiva(p),hRef)<limite)||null;
}

/* Redistribui apenas os pacientes pendentes após mudança de calibração ou
   intervalo. Pacientes com dose registrada mantêm o horário, e o cursor nunca
   retrocede: nenhum pendente fica antes da nova calibração + 15 minutos. */
function redistribuirAposCalibracao(prevLista,hAntiga,hNova,intervalo){
  if(!prevLista.length)return prevLista;
  const ref=hAntiga||hNova;
  const ordenada=[...prevLista].sort((a,b)=>getRelMin(a.hSim,ref)-getRelMin(b.hSim,ref));
  const gap=Number(intervalo)||25;
  let cursor=addMin(hNova,15);
  return ordenada.map(p=>{
    if(temDoseRegistrada(p)){
      const aposDose=addMin(horaInjecaoEfetiva(p),gap);
      if(getRelMin(aposDose,hNova)>getRelMin(cursor,hNova))cursor=aposDose;
      return p;
    }
    const novoHorario=cursor;
    cursor=addMin(cursor,gap);
    return p.hSim!==novoHorario?{...p,hSim:novoHorario}:p;
  });
}

function getRisco(doseAplicar,dPmin,dPmax,temReal,doseRealVal){
  if(temReal&&doseRealVal<dPmin-0.05)return'danger';
  if(temReal&&doseRealVal>=dPmin-0.05)return'done';
  if(doseAplicar>=dPmax-0.05)return'ok';
  if(doseAplicar>=dPmin-0.05)return'warn';
  return'danger';
}

function useVersaoDesatualizada(){
  const [nova,setNova]=useState(null);
  useEffect(()=>{
    let ativo=true;
    const conferir=()=>{
      fetch('./index.html',{cache:'no-store'})
        .then(r=>r.ok?r.text():null)
        .then(t=>{
          if(!ativo||!t)return;
          const m=t.match(/const APP_BUILD="([^"]+)"/);
          if(m&&m[1]!==APP_BUILD)setNova(m[1]);
        })
        .catch(()=>{});
    };
    conferir();
    const timer=setInterval(conferir,300000);
    document.addEventListener('visibilitychange',conferir);
    return()=>{ativo=false;clearInterval(timer);document.removeEventListener('visibilitychange',conferir);};
  },[]);
  return nova;
}

function BarraAtualizacao({lang}){
  const nova=useVersaoDesatualizada();
  if(!nova)return null;
  const recarregar=async()=>{
    try{
      if('caches'in window){
        const nomes=await caches.keys();
        await Promise.all(nomes.map(nome=>caches.delete(nome)));
      }
      if(navigator.serviceWorker){
        const registros=await navigator.serviceWorker.getRegistrations();
        await Promise.all(registros.map(registro=>registro.unregister()));
      }
    }catch(_){}
    location.reload();
  };
  return <div style={{position:'fixed',left:0,right:0,top:0,zIndex:5000,background:'var(--warning)',color:'#fff',
      padding:'10px 16px',paddingTop:'max(env(safe-area-inset-top),10px)',display:'flex',alignItems:'center',
      justifyContent:'center',gap:12,boxShadow:'var(--shadow-md)',flexWrap:'wrap'}}>
    <span style={{fontSize:13,fontWeight:800}}>{lang.versaoDesatualizada}</span>
    <button onClick={recarregar} style={{background:'#fff',color:'var(--warning)',border:'none',borderRadius:8,
      padding:'6px 14px',fontWeight:800,fontSize:12,cursor:'pointer'}}>{lang.versaoRecarregar}</button>
  </div>;
}

// Célula de horário (input type=time) que só aplica a mudança ao concluir a
// edição (blur/Enter). Enquanto digita, o valor fica em estado local — evitando
// que valores intermediários (ex.: "00:20") disparem a cascata e reordenem/
// corrompam os pacientes seguintes no meio da digitação.
function TimeCell({value,onCommit,style}){
  const [v,setV]=useState(value);
  useEffect(()=>{setV(value);},[value]);
  function commit(){
    if(v && /^\d{2}:\d{2}$/.test(v)){ if(v!==value&&onCommit(v)===false)setV(value); }
    else { setV(value); }
  }
  return <input className="t-inp mono" type="time" value={v}
    onChange={e=>setV(e.target.value)}
    onBlur={commit}
    onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }}
    style={style}/>;
}

function TelaPrincipal({cfg,setCfg,lista,setLista,cor,onSalvar,salvandoPdf,onCalc,onLimpar,setMenuOpen,showToast,lang}){
  const t12=getT12(cfg.farmaco,cfg.mvCustom);
  const perda=parseFloat(cfg.perda)||4;
  const fMinG=parseFloat(cfg.fMin)||0.08;
  const fMxG=parseFloat(cfg.fMax)||0.12;
  const acN=parseFloat(cfg.aCalib)||0;
  const vcN=parseFloat(cfg.vCalib)||0;
  
  const [leftWidth, setLeftWidth] = useState(380);
  const resizingRef = useRef(false);

  const {lista:lc,atvFinal}=useMemo(()=>recalc(lista,cfg.aCalib,cfg.vCalib,cfg.hCalib,t12,perda,fMinG,fMxG),[lista,cfg,t12,perda,fMinG,fMxG]);
  const dispList=useMemo(()=>[...lc].sort((a,b)=>getRelMin(a.hSim, cfg.hCalib)-getRelMin(b.hSim, cfg.hCalib)),[lc, cfg.hCalib]);

  function upd(id,updates){
    if(updates.hSim!==undefined){ setLista(prev=>cascataHorario(prev, cfg.hCalib, id, updates.hSim)); return; }
    setLista(prev=>prev.map(x=>x.id===id ? {...x,...updates} : x));
  }
  function updHoraReal(p,valor){
    if(!horaValida(valor)||getRelMin(valor,cfg.hCalib)<0){
      showToast(lang.injecaoMenorCalib.replace("{h}",valor||"—").replace("{c}",cfg.hCalib));
      return false;
    }
    upd(p.id,{hInjReal:valor});
    return true;
  }
  function del(id){
    if(confirm(lang.confirmarExclusao.replace("{nome}","este paciente"))){
      vib(); setLista(p=>p.filter(x=>x.id!==id)); showToast(lang.pacienteRemovido);
    }
  }
  function addRow(){
    vib();
    const sorted=[...lista].sort((a,b)=>getRelMin(a.hSim, cfg.hCalib)-getRelMin(b.hSim, cfg.hCalib));
    const gap = Number(cfg.intervalo) || 25;
    const sugerida = sorted.length ? addMin(sorted[sorted.length-1].hSim, gap) : addMin(cfg.hCalib||"08:00",15);
    setLista(v=>[...v, { id: Date.now(), nome: "", peso: "", hSim: sugerida, fMin: cfg.fMin||"0.08", fMax: cfg.fMax||"0.12", doseReal: "", hInjReal: "" }]);
  }

  // Lógica de Redimensionamento do PC
  useEffect(() => {
    const handleMouseMove = (e) => {
      if (!resizingRef.current) return;
      let newW = e.clientX;
      if (newW < 280) newW = 280; 
      if (newW > window.innerWidth * 0.5) newW = window.innerWidth * 0.5; 
      setLeftWidth(newW);
    };
    const handleMouseUp = () => {
      if (resizingRef.current) {
        resizingRef.current = false;
        document.body.style.cursor = 'default';
        document.body.style.userSelect = 'auto';
      }
    };
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    return () => {
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('mouseup', handleMouseUp);
    };
  }, []);

  const handleMouseDown = (e) => {
    e.preventDefault();
    resizingRef.current = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none'; 
  };

  const dispGlobal = atvFinal; 
  const pctGlobal = Math.max(0, Math.min(100, acN > 0 ? (dispGlobal / acN) * 100 : 0));
  const barColor = dispGlobal < 0 ? "var(--danger)" : pctGlobal > 40 ? "var(--success)" : pctGlobal > 20 ? "var(--warning)" : "var(--danger)";

  return <div className="screen">
    <div className="hdr">
      <div>
        <div style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px"}}>PET·CT <span style={{color:cor}}>Dose</span></div>
        <div style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginTop:2}}>{dataHoje()}</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={()=>{vib();onCalc();}} className="ghost" style={{padding:'0 14px',fontWeight:900,fontSize:12,letterSpacing:0.5,minWidth:54}} title={lang.navCalc}>CALC</button>
        <button onClick={()=>{vib();onSalvar();}} disabled={salvandoPdf} className="ghost" style={{padding:'0 14px',fontWeight:900,fontSize:12,letterSpacing:0.5,minWidth:54}} title={lang.salvarPdf}>{salvandoPdf ? "..." : "PDF"}</button>
        <button onClick={()=>{vib();setMenuOpen(true);}} className="ghost" style={{padding:'0 12px'}} title={lang.configuracoes}>{ICONS.settings}</button>
      </div>
    </div>

    <div className="scroll no-nav split-layout">
      
      {/* PAINEL ESQUERDO: Configurações e Frasco */}
      <div className="split-left" style={{ width: window.innerWidth >= 1024 ? leftWidth : '100%' }}>
        <div className="card" style={{padding:16, border:'none', marginBottom:16}}>
          <div className="g2" style={{marginBottom:12}}>
            <Fld label={lang.radiofarmacoLote}><select className="inp" value={cfg.farmaco} onChange={e=>setCfg({...cfg,farmaco:e.target.value})} style={{fontWeight:700, height:42}}>{Object.keys(FARMACOS).map(f=><option key={f}>{f}</option>)}</select></Fld>
            <Fld label={cfg.farmaco==="Outro"?lang.meiaVidaMin:lang.meiaVida}>{cfg.farmaco==="Outro"?<input className="inp" type="number" value={cfg.mvCustom} onChange={e=>setCfg({...cfg,mvCustom:e.target.value})} step="0.01" style={{height:42}}/>:<div className="inp" style={{background:"var(--bg)",color:"var(--muted)",display:"flex",alignItems:"center",borderColor:"transparent", height:42}}>{t12.toFixed(1)} min</div>}</Fld>
          </div>
          <div className="g2" style={{marginBottom:12}}>
            <Fld label={lang.perdaSeringa}><input className="inp" type="number" value={cfg.perda} onChange={e=>setCfg({...cfg,perda:e.target.value})} step="0.5" style={{height:42}}/></Fld>
            <Fld label={lang.idLote}><input className="inp" value={cfg.lote} onChange={e=>setCfg({...cfg,lote:e.target.value})} placeholder={lang.opcional} style={{height:42}}/></Fld>
          </div>
          <div className="g3" style={{alignItems:'end'}}>
            <Fld label={lang.horario}><input className="inp mono" type="time" value={cfg.hCalib} onChange={e=>setCfg({...cfg,hCalib:e.target.value})} style={{fontWeight:800, height:46}}/></Fld>
            <Fld label={lang.atividadeMci}><input className="inp mono" type="number" value={cfg.aCalib} onChange={e=>setCfg({...cfg,aCalib:e.target.value})} placeholder="Ex: 95.8" style={{borderColor:cor,borderWidth:2,background:'var(--surface)', height:46}}/></Fld>
            <Fld label={lang.volumeMl}><input className="inp mono" type="number" value={cfg.vCalib} onChange={e=>setCfg({...cfg,vCalib:e.target.value})} placeholder="Ex: 0.8" style={{height:46}}/></Fld>
          </div>
        </div>
        
        {(acN>0 && vcN>0) && (
          <div style={{padding:'0 4px', marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
              <span style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1}}>{lang.disponivel} Final</span>
              <span style={{fontSize:16,fontWeight:900,fontFamily:'var(--font-mono)',color:barColor}}>{f1(dispGlobal)} <span style={{fontSize:11,fontWeight:700,color:'var(--muted)'}}>mCi</span></span>
            </div>
            <div className="frasco-bar-wrap"><div className="frasco-bar" style={{width:`${pctGlobal}%`,background:barColor}}/></div>
          </div>
        )}

        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{color:'var(--muted)',fontWeight:800,fontSize:14,display:'flex',alignItems:'center',gap:8,padding:'4px 0'}}>
              {ICONS.settings} <span style={{fontSize:11, textTransform:'uppercase', letterSpacing: 1}}>{lang.janelaDose} Padrão</span>
            </div>
          </div>

          <div className="fi" style={{marginTop:8, background:'var(--alt)',border:'1px solid var(--border)',borderRadius:16,padding:'16px'}}>
            <div className="g2">
              <Fld label={lang.doseMin}><input className="inp" type="number" step="0.01" value={cfg.fMin} onChange={e=>setCfg({...cfg,fMin:e.target.value})}/></Fld>
              <Fld label={lang.doseMax}><input className="inp" type="number" step="0.01" value={cfg.fMax} onChange={e=>setCfg({...cfg,fMax:e.target.value})}/></Fld>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:12,marginTop:16}}>
              <Fld label={lang.captacao}><input className="inp" type="number" value={cfg.uptake??60} onChange={e=>setCfg({...cfg,uptake:e.target.value===""?"":parseInt(e.target.value)})} onBlur={e=>setCfg(c=>({...c,uptake:parseInt(e.target.value)||60}))}/></Fld>
              <Fld label={lang.gapInjecao}><input className="inp" type="number" value={cfg.intervalo??25} onChange={e=>setCfg({...cfg,intervalo:e.target.value===""?"":parseInt(e.target.value)})} onBlur={e=>setCfg(c=>({...c,intervalo:parseInt(e.target.value)||25}))}/></Fld>
              <Fld label={lang.duracaoExame}><input className="inp" type="number" value={cfg.duracaoExame??25} onChange={e=>setCfg({...cfg,duracaoExame:e.target.value===""?"":parseInt(e.target.value)})} onBlur={e=>setCfg(c=>({...c,duracaoExame:parseInt(e.target.value)||25}))}/></Fld>
            </div>
          </div>
        </div>

        <button onClick={()=>{if(confirm(lang.confirmarApagar)){ vib();onLimpar();showToast(lang.apagarOperacao);}}} className="ghost" style={{width:'100%',marginTop:18,color:'var(--danger)',borderColor:'color-mix(in srgb,var(--danger) 30%,transparent)',background:'color-mix(in srgb,var(--danger) 10%,transparent)'}}>{lang.apagarOperacao}</button>
      </div>

      <div className="resizer" onMouseDown={handleMouseDown} />

      {/* PAINEL DIREITO: Tabela de Operação Expandida */}
      <div className="split-right">
        <div className="tbl-wrap" style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 16px', borderBottom:'1px solid var(--border)', background:'var(--surface)', flexShrink: 0}}>
            <span style={{fontSize:14, fontWeight:800, color:'var(--text)'}}>{lang.operacaoTab} ({lista.length})</span>
            <div style={{display:'flex', gap:8}}>
              <button onClick={addRow} className="btn" style={{height:36, padding:'0 16px', borderRadius:8, fontSize:13}}>+ Adicionar Linha</button>
            </div>
          </div>
          <div style={{ overflow: 'auto', flex: 1 }}>
            <table className="tbl">
              <thead>
                <tr>
                  <th style={{textAlign:'left'}}>{lang.nomePaciente}</th>
                  <th>{lang.horaPrevista}</th>
                  <th style={{color:'var(--c)'}}>{lang.horaReal}</th>
                  <th style={{color:'var(--time)'}}>{lang.sala}</th>
                  <th>{lang.pesoKg}</th>
                  <th style={{color:'var(--warning)'}} title={lang.doseMin}>MÍN</th><th style={{color:'var(--warning)'}} title={lang.doseMax}>MÁX</th>
                  <th style={{color:'var(--c)'}}>PROG. (mCi)</th><th style={{color:'var(--success)'}}>DISP. (mCi)</th>
                  <th>VOL. (mL)</th><th style={{color:'var(--text)'}}>REAL (mCi)</th><th></th>
                </tr>
              </thead>
              <tbody>
                {dispList.map((p, i) => {
                  const hEfetiva = horaInjecaoEfetiva(p);
                  const dtInj = getRelMin(hEfetiva, cfg.hCalib);
                  const atvInj = decair(acN, t12, Math.max(dtInj, 0));
                  const conc = vcN > 0 ? atvInj / vcN : 0;
                  const doseRealVal = parseFloat(p.doseReal);
                  const temReal = !isNaN(doseRealVal) && doseRealVal > 0;
                  const doseExib = temReal ? doseRealVal : p.doseAplicar;
                  const vol = conc > 0 ? doseExib / conc : null;
                  
                  const hSala = horaEntradaSala(p, cfg.uptake);
                  const entradaEstimada = temReal && !horaValida(p.hInjReal);
                  
                  if (p.guilhotina) {
                    return (
                      <tr key={p.id} style={{background: 'color-mix(in srgb, var(--danger) 5%, transparent)'}}>
                        <td><input className="t-inp txt" value={p.nome} onChange={e=>upd(p.id, {nome: e.target.value})} style={{color:'var(--danger)'}}/></td>
                        <td><TimeCell value={p.hSim} onCommit={v=>upd(p.id, {hSim: v})} style={{color:'var(--danger)'}}/></td>
                        <td><div className="mono" style={{color:'var(--muted)'}}>—</div></td>
                        <td><div className="mono" style={{fontWeight:800, color:'var(--danger)', opacity:0.8}}>{hSala}</div></td>
                        <td><input className="t-inp mono" type="number" step="1" value={p.peso} onChange={e=>upd(p.id, {peso: e.target.value, doseReal:"", doseReferencia:"",hInjReal:""})} style={{width: 60, color:'var(--danger)'}} /></td>
                        <td colSpan="5" style={{fontSize:11, color:'var(--danger)', fontWeight:800, textAlign:'center'}}>
                          GUILHOTINADO • REQ: {f1(p.dPmin)} / DISP: {f1(p.doseRealExistente)} mCi
                        </td>
                        <td><input className="t-inp mono" type="number" step="0.1" value={p.doseReal} onChange={e=>upd(p.id, atualizacaoDoseReal(p,e.target.value))} placeholder="—" style={{width: 70}} /></td>
                        <td><button onClick={()=>del(p.id)} style={{background:'transparent', border:'none', color:'var(--danger)', cursor:'pointer', padding:8}}>{ICONS.trash}</button></td>
                      </tr>
                    )
                  }
                  
                  const isDoseOk = temReal ? doseRealVal >= p.dPmin - 0.05 : p.doseAplicar >= p.dPmin - 0.05;
                  const dColor = isDoseOk ? 'var(--success)' : 'var(--danger)';
                  
                  return (
                    <tr key={p.id}>
                      <td><input className="t-inp txt" value={p.nome} onChange={e=>upd(p.id, {nome: e.target.value})} placeholder={`Paciente ${i+1}`} /></td>
                      <td><TimeCell value={p.hSim} onCommit={v=>upd(p.id, {hSim: v})} /></td>
                      <td>{temReal?<TimeCell value={p.hInjReal||""} onCommit={v=>updHoraReal(p,v)} style={{color:horaValida(p.hInjReal)?'var(--c)':'var(--warning)',minWidth:92}}/>:<div className="mono" style={{color:'var(--muted)'}}>—</div>}</td>
                      <td><div className="mono" title={entradaEstimada?lang.pdfHorarioEstimado:undefined} style={{fontWeight:800, color:entradaEstimada?'var(--warning)':'var(--time)'}}>{entradaEstimada?'~':''}{hSala}</div></td>
                      <td><input className="t-inp mono" type="number" step="1" value={p.peso} onChange={e=>upd(p.id, {peso: e.target.value, doseReal:"", doseReferencia:"",hInjReal:""})} placeholder="0" style={{width: 60}} /></td>
                      <td><input className="t-inp mono sm" type="number" step="0.01" value={p.fMin || cfg.fMin} onChange={e=>upd(p.id, {fMin: e.target.value})} style={{width: 65, color:'var(--muted)'}} /></td>
                      <td><input className="t-inp mono sm" type="number" step="0.01" value={p.fMax || cfg.fMax} onChange={e=>upd(p.id, {fMax: e.target.value})} style={{width: 65, color:'var(--muted)'}} /></td>
                      <td>
                        {parseFloat(p.peso) > 0 && <div title={`${lang.janelaClinica}: ${f1(p.dPmin)} ~ ${f1(p.dPmax)} mCi`} style={{fontSize: 10, color: (tetoSugerido(p,temReal) < p.dPmax - 0.05) ? 'var(--warning)' : 'var(--muted)', fontWeight: 700, marginBottom: 2}}>{f1(p.dPmin)} ~ {f1(tetoSugerido(p,temReal))}</div>}
                        <div className="mono" style={{fontWeight:900, color: dColor}}>{f1(p.doseAplicar)}</div>
                      </td>
                      <td><div className="mono" style={{fontWeight:800, color:'var(--success)'}}>{f1(p.disp)}</div></td>
                      <td><div className="mono" style={{fontWeight:700, color:'var(--text-soft)'}}>{vol != null && !isNaN(vol) ? vol.toFixed(2) : '—'}</div></td>
                      <td style={{background: temReal ? 'var(--c-light)' : 'transparent'}}><input className="t-inp mono" type="number" step="0.1" value={p.doseReal} onChange={e=>upd(p.id, atualizacaoDoseReal(p,e.target.value))} placeholder="—" style={{width: 70, background: temReal ? 'var(--surface)' : 'var(--alt)'}} /></td>
                      <td><button onClick={()=>del(p.id)} style={{background:'transparent', border:'none', color:'var(--danger)', cursor:'pointer', padding:8}}>{ICONS.trash}</button></td>
                    </tr>
                  )
                })}
                {!dispList.length && <tr><td colSpan="12" style={{padding:40, color:'var(--muted)', fontWeight:600}}>{lang.nenhumAgendamento}</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>;
}

  const t12=getT12(cfg.farmaco,cfg.mvCustom);

      loteCompletoRef.current=true; showToast(<>{ICONS.check} {lang.loteTab} salvo!</>);
    }
  }
  function handleVCalibBlur(e){
    const val=e.target.value;

          <Fld label={lang.isotopo}><select className="inp" value={cfg.farmaco} onChange={e=>setCfg({...cfg,farmaco:e.target.value})} style={{fontWeight:700}}>{Object.keys(FARMACOS).map(f=><option key={f}>{f}</option>)}</select></Fld>
          <Fld label={cfg.farmaco==="Outro"?lang.meiaVidaMin:lang.meiaVida}>{cfg.farmaco==="Outro"?<input className="inp" type="number" value={cfg.mvCustom} onChange={e=>setCfg({...cfg,mvCustom:e.target.value})} step="0.01"/>:<div className="inp" style={{background:"var(--bg)",color:"var(--muted)",display:"flex",alignItems:"center",borderColor:"transparent"}}>{t12.toFixed(1)} min</div>}</Fld>

        <div className="g2">
          <Fld label={lang.perdaSeringa}><input className="inp" type="number" value={cfg.perda} onChange={e=>setCfg({...cfg,perda:e.target.value})} step="0.5"/></Fld>
          <Fld label={lang.idLote}><input className="inp" value={cfg.lote} onChange={e=>setCfg({...cfg,lote:e.target.value})} placeholder={lang.opcional}/></Fld>
        </div>
      </div>
      <div className="sec">{lang.calibracaoFrasco}</div>
      <div className="card" style={{padding:20,border:'none'}}>
        <div className="g3" style={{marginBottom:acN>0?18:0,alignItems:'end'}}>
          <Fld label={lang.horario}><input className="inp mono" type="time" value={cfg.hCalib} onChange={e=>setCfg({...cfg,hCalib:e.target.value})} style={{fontWeight:800,fontSize:14,padding:'0 8px'}}/></Fld>

          <div>
            <div style={{fontSize:11,fontWeight:800,color:cor,textTransform:'uppercase',letterSpacing:1}}>{lang.atividadeCalibrada}</div>
            <div className="mono" style={{fontSize:34,fontWeight:900,color:'var(--text)',lineHeight:1,marginTop:6}}>{f1(acN)} <span style={{fontSize:14,color:'var(--muted)'}}>mCi</span></div>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:4,fontWeight:600}}>≈ {mbq(acN)} MBq</div>

          {vcN>0&&<div style={{textAlign:'right'}}>
            <div style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1}}>{lang.concentracao}</div>
            <div className="mono" style={{fontSize:24,fontWeight:900,marginTop:6}}>{(acN/vcN).toFixed(2)}</div>
            <div style={{fontSize:12,color:'var(--muted)',fontWeight:600}}>mCi/mL</div>
          </div>}
        </div>}
      </div>
      <button onClick={()=>{if(confirm(lang.confirmarApagar)){ vib();onLimpar();}}} className="ghost" style={{width:'100%',marginTop:18,color:'var(--danger)',borderColor:'color-mix(in srgb,var(--danger) 30%,transparent)',background:'color-mix(in srgb,var(--danger) 10%,transparent)'}}>{lang.apagarOperacao}</button>
    </div>
  </div>;
}

function PatientCard({p,isN,cor,acNum,vcNum,t12,hCalib,uptake,duracaoExame,onUpdate,onDelete,showToast,lang}){
  const [exp,setExp]=useState(false);
  const doseReal=p.doseReal||"";
  const temReal=parseFloat(doseReal)>0;
  const doseRealVal=parseFloat(doseReal)||0;
  
  const isGuilhotina = p.guilhotina;
  const r = isGuilhotina ? 'danger' : getRisco(p.doseAplicar, p.dPmin, p.dPmax, temReal, doseRealVal);
  const doseColor = isGuilhotina ? 'var(--danger)' : r==='done'||r==='ok'?'var(--success)':r==='warn'?'var(--warning)':'var(--danger)';
  const barColor = isGuilhotina ? 'var(--danger)' : r==='done'?'var(--c)':r==='ok'?'var(--success)':r==='warn'?'var(--warning)':'var(--danger)';
  const hmC = isGuilhotina ? 'hm-guilhotina' : r==='done'?'hm-done':r==='ok'?'hm-ok':r==='warn'?'hm-warn':'hm-danger';

  const doseExib=temReal?parseFloat(doseReal):p.doseAplicar;
  const hEfetiva=horaInjecaoEfetiva(p);
  const dtInj=getRelMin(hEfetiva, hCalib);
  const atvInj=decair(acNum,t12,Math.max(dtInj,0));
  const conc=vcNum>0?atvInj/vcNum:0;
  const vol=conc>0?doseExib/conc:null;
  const entrada=horaEntradaSala(p,uptake);
  const termino=horaTerminoExame(p,uptake,duracaoExame);
  const entradaEstimada=temReal&&!horaValida(p.hInjReal);

  const [nome, setNome] = useState(p.nome);
  const [peso, setPeso] = useState(p.peso);
  const [fMin, setFMin] = useState(p.fMin || "0.08");
  const [fMax, setFMax] = useState(p.fMax || "0.12");
  const [hh,setHh]=useState(p.hSim.split(':')[0]);
  const [mm,setMm]=useState(p.hSim.split(':')[1]);

  useEffect(()=>{setNome(p.nome);},[p.nome]); useEffect(()=>{setPeso(p.peso);},[p.peso]);
  useEffect(()=>{setFMin(p.fMin||"0.08");},[p.fMin]); useEffect(()=>{setFMax(p.fMax||"0.12");},[p.fMax]);
  useEffect(()=>{setHh((p.hSim).split(':')[0]);},[p.hSim]); useEffect(()=>{setMm((p.hSim).split(':')[1]);},[p.hSim]);

  function setHora(m){ onUpdate(p.id,{hSim:minsToTime(m)}); }
  function confirmarHora(){
    const h=Math.max(0,Math.min(23,parseInt(hh)||0)); const m=Math.max(0,Math.min(59,parseInt(mm)||0));
    const novoMin=h*60+m;
    if(getRelMin(novoMin, hCalib)<0){
      showToast(lang.injecaoMenorCalib.replace("{h}",minsToTime(novoMin)).replace("{c}",hCalib));
      setHh((p.hSim).split(':')[0]); setMm((p.hSim).split(':')[1]); return;
    }
    setHora(novoMin); setHh(String(h).padStart(2,'0')); setMm(String(m).padStart(2,'0'));
  }
  function handleBlurHora(e){ const next=e.relatedTarget; if(!e.currentTarget.contains(next)) confirmarHora(); }
  function handleRealChange(val){onUpdate(p.id,atualizacaoDoseReal(p,val));}
  function handleHoraReal(val){
    if(!horaValida(val)||getRelMin(val,hCalib)<0){
      showToast(lang.injecaoMenorCalib.replace("{h}",val||"—").replace("{c}",hCalib));
      return false;
    }
    onUpdate(p.id,{hInjReal:val});
    return true;
  }

  return(
    <div className={`card fi ${hmC}`} style={{border:isN?`2px solid ${cor}`:undefined}}>
      <div className="pc-row" onClick={()=>{vib();setExp(!exp);}}>
        <div style={{minWidth:0}}>
          <div className="pc-name" style={{fontSize: exp ? 20 : 16, transition: 'font-size 0.3s cubic-bezier(0.16, 1, 0.3, 1)', color: isGuilhotina ? 'var(--danger)' : 'inherit'}}>
            {isN&&<span style={{color:cor,marginRight:6,fontSize:14}}>✦</span>}
            {exp ? <input className="inp-clean" value={nome} onChange={e=>setNome(e.target.value)} onBlur={()=>onUpdate(p.id, {nome:nome.trim()})} onClick={e=>e.stopPropagation()} style={{width:'100%', color:'inherit'}} /> : <span>{p.nome}</span>}
          </div>
          <div className="pc-meta" style={{marginTop: exp ? 8 : 4}}>
            {exp ? (
              <div style={{display:'flex', alignItems:'center', color: isGuilhotina ? 'var(--danger)' : 'var(--c)'}} onBlur={handleBlurHora} onClick={e=>e.stopPropagation()}>
                <input className="inp-clean" type="number" inputMode="numeric" min="0" max="23" value={hh} onChange={e=>setHh(e.target.value.slice(-2))} style={{width:34, fontSize:24, fontWeight:900, textAlign:'center', fontFamily:'var(--font-mono)'}} />
                <span style={{fontSize:24, fontWeight:900, margin:'0 2px', opacity:0.5}}>:</span>
                <input className="inp-clean" type="number" inputMode="numeric" min="0" max="59" value={mm} onChange={e=>setMm(e.target.value.slice(-2))} style={{width:34, fontSize:24, fontWeight:900, textAlign:'center', fontFamily:'var(--font-mono)'}} />
              </div>
            ) : <span style={{fontSize:16,fontWeight:700,color:isGuilhotina?'var(--danger)':'var(--text)'}}>{p.hSim}</span>}
            
            <span style={{fontSize: exp ? 14 : 12, color:'var(--muted)', fontWeight:600, display:'flex', alignItems:'center', marginLeft: 10}}>
              {exp ? <><input className="inp-clean" type="number" inputMode="decimal" value={peso} onChange={e=>setPeso(e.target.value)} onBlur={()=>onUpdate(p.id, peso!==p.peso?{peso, doseReal:"", doseReferencia:"",hInjReal:""}:{peso})} onClick={e=>e.stopPropagation()} style={{width: 44, textAlign:'center', margin:'0 4px', fontSize:15, fontWeight:700, color:'var(--text)'}} /> kg</> : <span>{' • '}{p.peso} kg</span>}
            </span>
          </div>
          <div style={{fontSize:11,color:entradaEstimada?'var(--warning)':'var(--muted)',fontWeight:700,marginTop:5}}>
            {temReal?`${lang.horaReal}: ${horaValida(p.hInjReal)?p.hInjReal:'—'} · `:''}{entradaEstimada?'~':''}{lang.entradaReal}: {entrada}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          {isGuilhotina ? (
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
              <span style={{fontSize:10,fontWeight:800,color:'var(--danger)',textTransform:'uppercase',letterSpacing:1}}>{ICONS.alert} Falta Insumo</span>
              <span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>Req: {f1(p.dPmin)} mCi</span>
              <span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>Disp: {f1(p.doseRealExistente)} mCi</span>
            </div>
          ) : (
            <div className="pc-nums">
              <div style={{display:'flex',alignItems:'baseline',gap:4}}><span className="mono pc-dose" style={{color:doseColor}}>{f1(doseExib)}</span><span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>mCi</span></div>
              <div style={{display:'flex',alignItems:'baseline',gap:4}}><span className="mono pc-vol">{vol!=null&&!isNaN(vol)?vol.toFixed(2):'—'}</span><span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>mL</span></div>
            </div>
          )}
        </div>
      </div>
      <div className="pc-status-bar" style={{background:barColor}}/>

      {exp&&(
        <div style={{borderTop:'1px solid var(--border)',background:'var(--surface)',paddingBottom:16}} onClick={e=>e.stopPropagation()}>
          <div className="px-block" style={{marginBottom:18}}>
            {isGuilhotina && (
               <div style={{background:'color-mix(in srgb, var(--danger) 10%, transparent)', border:'1px solid var(--danger)', borderRadius:12, padding:'12px', marginBottom:16, textAlign:'center'}}>
                 <div style={{fontSize:12, fontWeight:700, color:'var(--danger)'}}>Dose Insuficiente para o Exame</div>
                 <div style={{fontSize:11, color:'var(--danger)', marginTop:4, opacity:0.8}}>O saldo físico ({f1(p.doseRealExistente)} mCi) não atinge a dose mínima ({f1(p.dPmin)} mCi) para o peso do paciente neste horário.</div>
               </div>
            )}
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:18}}>
              <div style={{background:'var(--alt)', border:'1px solid var(--border)', borderRadius:14, padding:'10px 14px'}}>
                <div style={{fontSize:10, fontWeight:800, color:'var(--muted)', textTransform:'uppercase'}}>{lang.doseMin} (mCi/kg)</div>
                <input className="inp-clean" type="number" step="0.01" value={fMin} onChange={e=>setFMin(e.target.value)} onBlur={()=>onUpdate(p.id, fMin!==(p.fMin||"0.08")?{fMin, doseReal:"", doseReferencia:"",hInjReal:""}:{fMin})} style={{fontSize:16, fontWeight:700,color:'var(--text)',width:'100%',marginTop:4}} onClick={e=>e.stopPropagation()}/>
              </div>
              <div style={{background:'var(--alt)', border:'1px solid var(--border)', borderRadius:14, padding:'10px 14px'}}>
                <div style={{fontSize:10, fontWeight:800, color:'var(--muted)', textTransform:'uppercase'}}>{lang.doseMax} (mCi/kg)</div>
                <input className="inp-clean" type="number" step="0.01" value={fMax} onChange={e=>setFMax(e.target.value)} onBlur={()=>onUpdate(p.id, fMax!==(p.fMax||"0.12")?{fMax, doseReal:"", doseReferencia:"",hInjReal:""}:{fMax})} style={{fontSize:16,fontWeight:700,color:'var(--text)',width:'100%',marginTop:4}} onClick={e=>e.stopPropagation()}/>
              </div>
            </div>
            {!isGuilhotina && (
              <>
                <div className="px-label" style={{display:'flex', alignItems:'center'}}>
                  {lang.doseAplicada}{p.isConstrained&&<span style={{color:'var(--warning)',marginLeft:8,fontSize:10,fontWeight:700,textTransform:'none',display:'flex',alignItems:'center',gap:4}}>{ICONS.info} {lang.atividadeLimitada}</span>}
                </div>
                <div className={`dose-real-wrap${temReal?' filled':''}`}>
                  <input className="dose-real-inp" type="number" inputMode="decimal" step="0.1" placeholder="0.0" value={doseReal} onChange={e=>handleRealChange(e.target.value)} onClick={e=>e.stopPropagation()} />
                  <span className="dose-real-unit">mCi</span>
                  {temReal&&(<button className="dose-real-clear" onClick={(e)=>{e.stopPropagation();handleRealChange("");}}>{ICONS.close}</button>)}
                </div>
                {temReal&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:12}}>
                  <div style={{background:'var(--alt)',border:'1px solid var(--border)',borderRadius:12,padding:8,textAlign:'center'}}>
                    <div style={{fontSize:9,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:4}}>{lang.horaReal}</div>
                    <TimeCell value={p.hInjReal||""} onCommit={handleHoraReal} style={{color:horaValida(p.hInjReal)?'var(--c)':'var(--warning)',padding:4,fontSize:14}}/>
                  </div>
                  <div style={{background:'var(--alt)',border:'1px solid var(--border)',borderRadius:12,padding:8,textAlign:'center'}}>
                    <div style={{fontSize:9,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:4}}>{lang.entradaReal}</div>
                    <div className="mono" style={{fontWeight:900,color:entradaEstimada?'var(--warning)':'var(--time)'}}>{entradaEstimada?'~':''}{entrada}</div>
                  </div>
                  <div style={{background:'var(--alt)',border:'1px solid var(--border)',borderRadius:12,padding:8,textAlign:'center'}}>
                    <div style={{fontSize:9,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:4}}>{lang.termino}</div>
                    <div className="mono" style={{fontWeight:900}}>{entradaEstimada?'~':''}{termino}</div>
                  </div>
                </div>}
              </>
            )}
            <div style={{marginTop:10,display:'flex',justifyContent:'center',gap:16}}>
              {[{l:'mín',v:p.dPmin,lim:false},{l:'máx',v:tetoSugerido(p,temReal),lim:tetoSugerido(p,temReal)<p.dPmax-0.05}].map(({l,v,lim})=>(
                <span key={l} style={{fontSize:11,color:lim?'var(--warning)':'var(--muted)',fontWeight:600}}>{l} <span className="mono" style={{fontWeight:800,color:lim?'var(--warning)':'var(--text)',opacity:lim?1:.7}}>{f1(v)}</span></span>
              ))}
              <span style={{fontSize:11,color:'var(--muted)',fontWeight:600}}>mCi</span>
            </div>
            {p.disp>0&&<div style={{marginTop:8,fontSize:11,color:'var(--muted)',fontWeight:600,textAlign:'center'}}>{lang.atividadeAtual} → <span className="mono" style={{fontWeight:800,color:'var(--text)',opacity:.8}}>{f1(p.disp)} mCi</span></div>}
          </div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:12, padding:'16px 20px 0', borderTop:'1px solid var(--border)'}}>
            <span style={{fontSize:11, color:'var(--muted)', fontWeight:600}}>ID: {p.id}</span>
            <button onClick={(e)=>{e.stopPropagation(); if(confirm(lang.confirmarExclusao.replace("{nome}",p.nome))) onDelete(p.id);}} style={{background:'transparent', border:'none', color:'var(--danger)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', padding:6}}>{ICONS.trash}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function TelaLista({cfg,setCfg,lista,setLista,cor,onNovo,onSalvar,salvandoPdf,ativa,showToast,onIrLote,lang}){
  const t12=getT12(cfg.farmaco,cfg.mvCustom); const perda=parseFloat(cfg.perda)||4;
  const fMinG=parseFloat(cfg.fMin)||0.08; const fMxG=parseFloat(cfg.fMax)||0.12;
  const acN=parseFloat(cfg.aCalib)||0; const vcNum=parseFloat(cfg.vCalib)||0;
  const [paramAberto, setParamAberto] = useState(false);

  const {lista:lc,atvFinal}=useMemo(()=>recalc(lista,cfg.aCalib,cfg.vCalib,cfg.hCalib,t12,perda,fMinG,fMxG),[lista,cfg,t12,perda,fMinG,fMxG]);
  const dispList=useMemo(()=>[...lc].sort((a,b)=>getRelMin(a.hSim, cfg.hCalib)-getRelMin(b.hSim, cfg.hCalib)),[lc, cfg.hCalib]);
  const [agora,setAgora]=useState(nowt());
  useEffect(()=>{const t=setInterval(()=>setAgora(nowt()),60000);return()=>clearInterval(t);},[]);

  const proxId=useMemo(()=>{
    const futuros=dispList.filter(p=>getRelMin(p.hSim, agora)>=0);
    if(futuros.length===0)return null;
    return futuros.reduce((a,b)=>getRelMin(a.hSim, agora)<=getRelMin(b.hSim, agora)?a:b).id;
  },[dispList,agora]);

  function upd(id,updates){
    if(updates.hSim!==undefined){ setLista(prev=>cascataHorario(prev, cfg.hCalib, id, updates.hSim)); return; }
    setLista(prev=>prev.map(x=>x.id===id?{...x,...updates}:x));
  }
  function del(id){vib();setLista(p=>p.filter(x=>x.id!==id));showToast(lang.pacienteRemovido);}

  const dispGlobal = atvFinal; 
  const pctGlobal = Math.max(0, Math.min(100, acN > 0 ? (dispGlobal / acN) * 100 : 0));
  const barColor = dispGlobal < 0 ? "var(--danger)" : pctGlobal > 40 ? "var(--success)" : pctGlobal > 20 ? "var(--warning)" : "var(--danger)";

  return <div className={`screen${ativa?"":" hidden"}`}>
    <div className="hdr">
      <div>
        <div style={{fontSize:22,fontWeight:900,letterSpacing:"-.5px"}}>{lang.operacaoTab} <span style={{color:cor}}>{lista.length>0?lista.length:""}</span></div>
        <div style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginTop:2}}>{cfg.farmaco}</div>
      </div>
      <button onClick={()=>{vib();onSalvar();}} disabled={salvandoPdf} className="ghost" style={{height:42,width:42,padding:0,borderRadius:12}} title={lang.salvarPdf}>{salvandoPdf ? "⏳" : ICONS.pdf}</button>
    </div>

    {lista.length>0&&(
      <div style={{padding:'12px 20px 10px',flexShrink:0,background:'var(--bg)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
          <span style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1}}>{lang.disponivel}</span>
          <span style={{fontSize:16,fontWeight:900,fontFamily:'var(--font-mono)',color:barColor}}>{f1(dispGlobal)} <span style={{fontSize:11,fontWeight:700,color:'var(--muted)'}}>mCi</span></span>
        </div>
        <div className="frasco-bar-wrap" style={{height:6,borderRadius:3, marginTop:0}}>
          <div className="frasco-bar" style={{width:`${pctGlobal}%`,background:barColor,borderRadius:3}}/>
        </div>
      </div>
    )}

    <div className="scroll" style={{paddingTop:12}}>
      {(!cfg.aCalib||!cfg.vCalib)&&(
        <div className="fi" style={{background:'color-mix(in srgb,var(--warning) 15%,transparent)',border:'1px solid color-mix(in srgb,var(--warning) 40%,transparent)',borderRadius:16,padding:'14px 18px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <span style={{fontSize:13,fontWeight:700,color:'var(--warning)',lineHeight:1.4}}>{lang.dadosFrascoIncompletos}</span>
          <button onClick={()=>{vib();onIrLote();}} style={{flexShrink:0,background:'var(--warning)',color:'#fff',border:'none',borderRadius:10,padding:'8px 12px',fontWeight:800,fontSize:12,cursor:'pointer',boxShadow:'var(--shadow-sm)'}}>{lang.irParaLote}</button>
        </div>
      )}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,paddingTop:4}}>
        <button onClick={()=>{vib();setParamAberto(!paramAberto)}} style={{background:'none',border:'none',color:'var(--muted)',fontWeight:800,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',gap:8,padding:'4px 0'}}>
          {ICONS.settings} <span style={{fontSize:16,transition:'transform .3s',display:'inline-block',transform:paramAberto?'rotate(180deg)':'rotate(0deg)'}}>▾</span>
        </button>
      </div>
      
      {paramAberto && (
        <div className="fi" style={{marginBottom:16,background:'var(--alt)',border:'1px solid var(--border)',borderRadius:16,padding:'16px'}}>
          <div>
            <div style={{fontSize:11,fontWeight:800,letterSpacing:1.5,textTransform:'uppercase',color:'var(--muted)',marginBottom:12}}>{lang.janelaDose} Padrão</div>
            <div className="g2">
              <Fld label={lang.doseMin}><input className="inp" type="number" step="0.01" value={cfg.fMin} onChange={e=>setCfg({...cfg,fMin:e.target.value})}/></Fld>
              <Fld label={lang.doseMax}><input className="inp" type="number" step="0.01" value={cfg.fMax} onChange={e=>setCfg({...cfg,fMax:e.target.value})}/></Fld>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:12,marginTop:16}}>
            <Fld label={lang.captacao}><input className="inp" type="number" value={cfg.uptake??60} onChange={e=>setCfg({...cfg,uptake:e.target.value===""?"":parseInt(e.target.value)})} onBlur={e=>setCfg(c=>({...c,uptake:parseInt(e.target.value)||60}))}/></Fld>
            <Fld label={lang.gapInjecao}><input className="inp" type="number" value={cfg.intervalo??25} onChange={e=>setCfg({...cfg,intervalo:e.target.value===""?"":parseInt(e.target.value)})} onBlur={e=>setCfg(c=>({...c,intervalo:parseInt(e.target.value)||25}))}/></Fld>
            <Fld label={lang.duracaoExame}><input className="inp" type="number" value={cfg.duracaoExame??25} onChange={e=>setCfg({...cfg,duracaoExame:e.target.value===""?"":parseInt(e.target.value)})} onBlur={e=>setCfg(c=>({...c,duracaoExame:parseInt(e.target.value)||25}))}/></Fld>
          </div>
        </div>
      )}

      {!lista.length&&<div style={{textAlign:'center',padding:'80px 20px',color:'var(--muted)',display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div style={{color:'var(--border)',marginBottom:16}}>{ICONS.empty}</div>
        <div style={{fontSize:18,fontWeight:800,color:'var(--text)'}}>{lang.nenhumAgendamento}</div>
        <div style={{marginTop:8,fontSize:14,fontWeight:500}}>{lang.toqueMais}</div>
      </div>}

      {dispList.map(p=>( <PatientCard key={p.id} p={p} isN={p.id===proxId} cor={cor} acNum={acN} vcNum={vcNum} t12={t12} hCalib={cfg.hCalib||"09:00"} uptake={cfg.uptake} duracaoExame={cfg.duracaoExame} onUpdate={upd} onDelete={del} showToast={showToast} lang={lang}/> ))}
    </div>
    <button className="fab" onClick={()=>{vib();onNovo();}}>+</button>
  </div>;
}

function TelaNovo({cfg,lista,onAdd,onBack,cor,ativa,showToast,lang}){
  const[nome,setNome]=useState(""),[ peso,setPeso]=useState("");
  const[hh,setHh]=useState("09"),[mm,setMm]=useState("00");
  const[fMnC,setFMnC]=useState(cfg.fMin||"0.08"),[fMxC,setFMxC]=useState(cfg.fMax||"0.12");
  const[paramOpen,setParamOpen]=useState(false);
  const h=`${hh.padStart(2,'0')}:${mm.padStart(2,'0')}`;

  function confirmarHoraBlur(e){
    if(!e.currentTarget.contains(e.relatedTarget)){
      const hv=Math.max(0,Math.min(23,parseInt(hh)||0)); const mv=Math.max(0,Math.min(59,parseInt(mm)||0));
      setHh(String(hv).padStart(2,'0')); setMm(String(mv).padStart(2,'0'));
    }
  }

  const ativaRef=useRef(false);
  useEffect(()=>{
    if(ativa&&!ativaRef.current){
      const sorted=[...lista].sort((a,b)=>getRelMin(a.hSim, cfg.hCalib)-getRelMin(b.hSim, cfg.hCalib));
      const gap = Number(cfg.intervalo) || 25;

          <Fld label={lang.horaInjecao}>
            <div style={{display:'flex',alignItems:'center',border:'1.5px solid var(--c)',borderRadius:14,overflow:'hidden',background:'var(--surface)',height:56,gap:0,boxShadow:'0 4px 12px var(--c-light)'}} onBlur={confirmarHoraBlur}>
              <input type="number" inputMode="numeric" min="0" max="23" value={hh} onChange={e=>setHh(e.target.value.slice(-2))} style={{flex:1,textAlign:'center',fontFamily:'monospace',fontSize:20,fontWeight:800,color:'var(--c)',background:'none',border:'none',outline:'none',height:'100%'}}/>

      <div style={{marginBottom:16}}>
        <button onClick={()=>setParamOpen(!paramOpen)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--alt)',border:'1px solid var(--border)',borderRadius:paramOpen?'16px 16px 0 0':'16px',padding:'14px 18px',cursor:'pointer',fontWeight:800,fontSize:13,letterSpacing:1.5,textTransform:'uppercase',color:'var(--muted)'}}>

        {[[lang.injecaoPrevista,h],[lang.entradaPrevista,addMin(h,cfg.uptake||UPTAKE)],[lang.terminoPrevisto,addMin(addMin(h,cfg.uptake||UPTAKE),parseInt(cfg.duracaoExame)||25)]].map(([l,v])=>(
          <div key={l} style={{flex:1,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:'12px 8px',textAlign:'center',boxShadow:'var(--shadow-sm)'}}>

        <div style={{fontSize:11,fontWeight:800,color:cor,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>{lang.doseAlvo} (INTERVALO)</div>
        <div className="mono" style={{fontSize:42,fontWeight:900,lineHeight:1}}>{f1(w*fMnC)} <span style={{fontSize:18,color:'var(--muted)'}}>~</span> {f1(w*fMxC)} <span style={{fontSize:18,color:'var(--muted)'}}>mCi</span></div>
      </div>}
      <button className="btn" onClick={()=>{
        if(!nome||!w)return;
        if(getRelMin(h, cfg.hCalib)<0){showToast(lang.injecaoMenorCalib.replace("{h}",h).replace("{c}",cfg.hCalib));return;}
        vib(); onAdd({id:Date.now(),nome:nome.trim(),peso,hSim:h,fMin:String(fMnC),fMax:String(fMxC),doseReal:"",hInjReal:""});
        setNome("");setPeso("");showToast(<>{ICONS.check} {lang.pacienteAdicionado}</>);
      }} disabled={!nome||!w} style={{height:56,fontSize:18,marginTop:8, width:'100%'}}>{lang.confirmarSalvar}</button>
    </div>
  </div>;

function TelaCalc({cor,ativa,onFechar,lang}){
  const[iso,setIso]=useState("Flúor-18 (¹⁸F)"); const[mv,setMv]=useState(109.77);
  const[a0,setA0]=useState(""); const[t0,setT0]=useState(nowt()); const[t1,setT1]=useState(addMin(nowt(),60));
  const t12=getT12(iso,mv);
  const res=useMemo(()=>{const a=parseFloat(a0);if(!a)return null;let dt=getRelMin(t1,t0);if(dt<0)dt+=1440;return{af:decair(a,t12,dt),dt};},[a0,t0,t1,t12]);
  return <div className={`screen fi${ativa?"":" hidden"}`} style={{zIndex:200}}>
    <div className="hdr">
      <button onClick={onFechar} className="ghost" style={{width:42,padding:0}}>{ICONS.close}</button>
      <div style={{flex:1,textAlign:'center',fontSize:18,fontWeight:900, display:'flex', alignItems:'center', justifyContent:'center', gap:8}}><span style={{color:cor}}>{ICONS.calc}</span> {lang.calcDecaimento}</div>
      <div style={{width:42}}/>
    </div>
    <div className="scroll">
      <div className="card" style={{padding:20,border:'none'}}>
        <div className="g2" style={{marginBottom:16}}>
          <Fld label={lang.isotopo}><select className="inp" value={iso} onChange={e=>setIso(e.target.value)} style={{fontWeight:700}}>{Object.keys(FARMACOS).map(f=><option key={f}>{f}</option>)}</select></Fld>
          <Fld label={lang.meiaVida}>{iso==="Outro"?<input className="inp" type="number" value={mv} onChange={e=>setMv(e.target.value)} step="0.01"/>:<div className="inp" style={{background:'var(--bg)',color:'var(--muted)',display:'flex',alignItems:'center',borderColor:'transparent'}}>{t12.toFixed(1)} min</div>}</Fld>
        </div>
        <Fld label={lang.atividadeInicial} style={{marginBottom:16}}><input className="inp mono" type="number" value={a0} onChange={e=>setA0(e.target.value)} placeholder="Ex: 10" step="0.1" style={{fontSize:20,fontWeight:800,height:56,borderColor:cor,background:'var(--surface)'}}/></Fld>
        <div className="g2">
          <Fld label={lang.horaInicial}><input className="inp mono" type="time" value={t0} onChange={e=>setT0(e.target.value)} style={{fontWeight:800,height:56}}/></Fld>
          <Fld label={lang.horaAlvo}><input className="inp mono" type="time" value={t1} onChange={e=>setT1(e.target.value)} style={{fontWeight:800,height:56}}/></Fld>
        </div>
      </div>
      {res&&<div className="card fi" style={{border:'none',background:`var(--c-light)`,boxShadow:`0 0 0 1px var(--c)`}}>
        <div style={{padding:'32px 20px',textAlign:'center'}}>
          <div style={{fontSize:11,color:cor,fontWeight:800,textTransform:'uppercase',letterSpacing:1.5,marginBottom:8}}>{lang.resultado}</div>
          <div className="mono" style={{fontSize:56,fontWeight:900,color:'var(--text)',lineHeight:1}}>{res.af.toFixed(2)} <span style={{fontSize:22,color:'var(--muted)'}}>mCi</span></div>
          <div style={{fontSize:14,color:'var(--text-soft)',marginTop:12,fontWeight:600}}>{lang.decorrido}: {res.dt} min • {lang.fator}: {Math.pow(2,-res.dt/t12).toFixed(4)}</div>
          <div style={{fontSize:16,fontWeight:800,color:'var(--muted)',marginTop:8}}>≈ {mbq(res.af)} MBq</div>
        </div>
      </div>}
    </div>
  </div>;
}

function PrintPDF({cfg,lista,totReal,restante,efic,cor,lang}){
  const acN=parseFloat(cfg.aCalib)||0; const vcN=parseFloat(cfg.vCalib)||0;
  const t12=getT12(cfg.farmaco,cfg.mvCustom); const perda=parseFloat(cfg.perda)||4;
  const uptake=parseInt(cfg.uptake)||60; const intervalo=parseInt(cfg.intervalo)||25; const duracao=parseInt(cfg.duracaoExame)||25;
  const concI=(acN>0&&vcN>0)?acN/vcN:0;
  const fMnG=parseFloat(cfg.fMin)||0.08; const fMxG=parseFloat(cfg.fMax)||0.12;
  const locale=lang._id==="en"?"en-US":lang._id==="es"?"es-ES":"pt-BR";
  const agoraDoc=new Date(); const pad=n=>String(n).padStart(2,"0");
  const docId=`PETCT-${agoraDoc.getFullYear()}${pad(agoraDoc.getMonth()+1)}${pad(agoraDoc.getDate())}-${pad(agoraDoc.getHours())}${pad(agoraDoc.getMinutes())}${pad(agoraDoc.getSeconds())}`;
  const geradoEm=agoraDoc.toLocaleString(locale);
  const pacientesAplicados=lista.filter(p=>parseFloat(p.doseReal)>0).length;
  const totalAplicado=lista.reduce((s,p)=>s+(parseFloat(p.doseReal)||0),0);
  const totalProgramado=lista.reduce((s,p)=>s+(parseFloat(p.doseAplicar)||0),0);
  const volTotalAplicado=lista.reduce((s,p)=>{
    const d=parseFloat(p.doseReal)||0; if(d<=0)return s;
    const dtI=getRelMin(horaInjecaoEfetiva(p),cfg.hCalib);
    const aAt=acN*Math.pow(0.5,dtI/t12)*(1-perda/100);
    const cAt=vcN>0?aAt/vcN:0;
    return s+(cAt>0?d/cAt:0);
  },0);
  const eficienciaAplicada=acN>0?(totalAplicado/acN*100):0;

  const TD={border:"1px solid #000",padding:"5px 6px",textAlign:"left",fontSize:8.2,color:"#000",background:"#fff",verticalAlign:"middle"};
  const TH={...TD,fontWeight:800,textTransform:"uppercase",fontSize:7.5,textAlign:"center"};
  const TDc={...TD,textAlign:"center"};
  const SEC={fontSize:9,fontWeight:900,textTransform:"uppercase",letterSpacing:0.5,borderBottom:"2px solid #000",paddingBottom:3,marginBottom:5,marginTop:11,color:"#000"};
  const infoRows=[
    [[lang.isotopo,cfg.farmaco],[lang.idLote,cfg.lote||"—"]],
    [[lang.pdfMeiaVida,`${t12.toFixed(2)} min`],[lang.pdfPerdaRF,`${perda}%`]],
    [[lang.pdfCalibracao,`${dataHoje()} · ${cfg.hCalib||"—"}`],[lang.pdfAtividade,`${f1(acN)} mCi (${(acN*37).toFixed(0)} MBq)`]],
    [[lang.pdfVolume2,vcN>0?`${vcN} mL`:"—"],[lang.pdfConcInicial,concI>0?`${concI.toFixed(2)} mCi/mL`:"—"]],
    [[lang.pdfCaptacao,`${uptake} min`],[lang.duracaoExame,`${duracao} min`]],
    [[lang.gapInjecao,`${intervalo} min`],[lang.janelaDose,`${fMnG.toFixed(2)}–${fMxG.toFixed(2)} mCi/kg`]]
  ];

  return <div style={{fontFamily:"Arial,sans-serif",color:"#000",background:"#fff",width:"100%"}}>
    <div style={{borderBottom:"3px solid #000",paddingBottom:8,marginBottom:8,textAlign:"center"}}>
      <div style={{fontSize:15,fontWeight:900,letterSpacing:0.4}}>{lang.pdfTitulo}</div>
      <div style={{fontSize:10,fontWeight:800,marginTop:3}}>{cfg.instituicao||lang.pdfInstituicaoNaoInformada}</div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:7.8,marginTop:7,textAlign:"left"}}>
        <span><b>{lang.pdfDataOperacao}:</b> {dataHoje()}</span>
        <span><b>{lang.pdfDocumento}:</b> {docId}</span>
        <span><b>{lang.pdfGeradoEm}:</b> {geradoEm}</span>
      </div>
    </div>

    <div style={SEC}>{lang.pdfIdentificacaoLote}</div>
    <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
      <tbody>
        {infoRows.map((row,i)=><tr key={i}>
          {row.map(([l,v])=><React.Fragment key={l}>
            <td style={{...TD,width:"19%",fontWeight:800}}>{l}</td>
            <td style={{...TD,width:"31%"}}>{v}</td>
          </React.Fragment>)}
        </tr>)}
      </tbody>
    </table>

    <div style={SEC}>{lang.pdfRegistroPacientes}</div>
    <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
      <thead><tr>
        <th style={{...TH,width:"3%"}}>#</th>
        <th style={{...TH,width:"17%",textAlign:"left"}}>{lang.pdfPaciente}</th>
        <th style={{...TH,width:"6%"}}>{lang.pdfPeso}</th>
        <th style={{...TH,width:"7%"}}>{lang.horaPrevista}</th>
        <th style={{...TH,width:"7%"}}>{lang.horaReal}</th>
        <th style={{...TH,width:"7%"}}>{lang.pdfEntradaSala}</th>
        <th style={{...TH,width:"7%"}}>{lang.pdfTermino}</th>
        <th style={{...TH,width:"9%"}}>{lang.pdfDoseProgramada}</th>
        <th style={{...TH,width:"9%"}}>{lang.pdfDoseInjetada}</th>
        <th style={{...TH,width:"8%"}}>{lang.pdfVolume}</th>
        <th style={{...TH,width:"11%"}}>{lang.pdfFaixaReferencia}</th>
        <th style={{...TH,width:"9%"}}>{lang.pdfStatus}</th>
      </tr></thead>
      <tbody>
        {!lista.length?<tr><td colSpan="12" style={{...TDc,padding:18}}>{lang.pdfSemRegistros}</td></tr>
        :lista.map((p,i)=>{
          const programada=parseFloat(p.doseAplicar)||0;
          const aplicada=parseFloat(p.doseReal)||0; const temReal=aplicada>0;
          const fmn=parseFloat(p.fMin)||fMnG; const fmx=parseFloat(p.fMax)||fMxG; const w=parseFloat(p.peso)||0;
          const min=p.dPmin||w*fmn; const max=p.dPmax||w*fmx;
          const hReal=horaValida(p.hInjReal)?p.hInjReal:""; const dtI=getRelMin(horaInjecaoEfetiva(p),cfg.hCalib);
          const aAt=acN*Math.pow(0.5,dtI/t12)*(1-perda/100); const cAt=vcN>0?aAt/vcN:0;
          const vol=temReal&&cAt>0?aplicada/cAt:0; const entrada=horaEntradaSala(p,uptake); const fim=horaTerminoExame(p,uptake,duracao);
          const estimado=!(temReal&&hReal);
          const conforme=temReal&&aplicada>=min-0.05&&aplicada<=max+0.05;
          const status=!temReal?lang.pdfPendente:conforme?lang.pdfConforme:lang.pdfForaFaixa;
          return <tr key={p.id}>
            <td style={{...TDc,fontWeight:800}}>{i+1}</td>
            <td style={{...TD,fontWeight:800}}>{p.nome||"—"}</td>
            <td style={TDc}>{p.peso||"—"} kg</td>
            <td style={{...TDc,fontWeight:800}}>{p.hSim||"—"}</td>
            <td style={{...TDc,fontWeight:800}}>{hReal||"—"}</td>
            <td style={TDc}>{estimado?'~':''}{entrada}</td>
            <td style={TDc}>{estimado?'~':''}{fim}</td>
            <td style={TDc}>{f1(programada)} mCi</td>
            <td style={{...TDc,fontWeight:900}}>{temReal?`${f1(aplicada)} mCi`:"—"}</td>
            <td style={TDc}>{vol>0?`${vol.toFixed(2)} mL`:"—"}</td>
            <td style={TDc}>{f1(min)}–{f1(max)} mCi</td>
            <td style={{...TDc,fontWeight:800}}>{status}</td>
          </tr>;
        })}
      </tbody>
    </table>
    {lista.some(p=>!temDoseRegistrada(p)||!horaValida(p.hInjReal))&&<div style={{fontSize:7,marginTop:4}}><b>~</b> {lang.pdfHorarioEstimado}</div>}

    <div style={SEC}>{lang.pdfConsolidacao}</div>
    <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
      <tbody>
        {[
          [[lang.pacientes,lista.length],[lang.pdfPacientesAplicados,`${pacientesAplicados}/${lista.length}`],[lang.pdfDoseProgramadaTotal,`${f1(totalProgramado)} mCi`]],
          [[lang.pdfDoseAplicadaTotal,`${f1(totalAplicado)} mCi`],[lang.pdfMbq,`${(totalAplicado*37).toFixed(0)} MBq`],[lang.pdfVolTotal,`${volTotalAplicado.toFixed(2)} mL`]],
          [[lang.pdfVolRestante,`${Math.max(vcN-volTotalAplicado,0).toFixed(2)} mL`],[lang.pdfSaldoCalculado,`${f1(restante)} mCi`],[lang.pdfEficienciaAplicada,`${eficienciaAplicada.toFixed(1)}%`]]
        ].map((row,i)=><tr key={i}>{row.map(([l,v])=><td key={l} style={{...TD,width:"33.33%"}}><b>{l}:</b> {v}</td>)}</tr>)}
      </tbody>
    </table>

    <div style={SEC}>{lang.pdfResponsabilidade}</div>
    <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:12,marginTop:18,fontSize:8.5}}>
      <div style={{borderTop:"1px solid #000",paddingTop:4,textAlign:"center"}}>{lang.pdfNomeResponsavel}</div>
      <div style={{borderTop:"1px solid #000",paddingTop:4,textAlign:"center"}}>{lang.pdfRegistroProfissional}</div>

function App(){
  const[uiMode,setUiMode]=useState(()=>localStorage.getItem("petct-ui-mode")||"table");
  const[tab,setTab]=useState(uiMode==="table"?"main":"lote");
  const[novo,setNovo]=useState(false);
  
  const[menu,setMenu]=useState(false);
  const[cor,setCor]=useState(()=>localStorage.getItem("petct-cor")||"#0A84FF");
  const[dark,setDark]=useState(()=>localStorage.getItem("petct-dark")==="true");
  const[vibOn,setVibOn]=useState(()=>localStorage.getItem("petct-vib")!=="false");
  const[toast,setToast]=useState(null);
  const[langId,setLangId]=useState(()=>localStorage.getItem("petct-lang")||"pt");
  const lang=LANGS_DICT[langId]||LANGS_DICT.pt;
  const tRef=useRef(null);
  
  const showToast=m=>{setToast(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToast(null),2800);};
  
  const[cfg,setCfg]=useState(()=>{
    try{ let parsed=JSON.parse(localStorage.getItem("petct-cfg")||"{}"); return{...CFG0,...parsed}; }
    catch(e){return CFG0;}
  });
  
  const[lista,setLista]=useState(()=>{
    try{ return JSON.parse(localStorage.getItem("petct-lista")||"[]"); }
    catch(e){return[];}
  });

  useEffect(()=>{localStorage.setItem("petct-cfg",JSON.stringify(cfg));},[cfg]);
  useEffect(()=>{localStorage.setItem("petct-lista",JSON.stringify(lista));},[lista]);
  useEffect(()=>{document.body.classList.toggle("dark",dark);localStorage.setItem("petct-dark",dark);},[dark]);
  useEffect(()=>{localStorage.setItem("petct-cor",cor);applyColor(cor);},[cor]);
  useEffect(()=>{localStorage.setItem("petct-vib",vibOn);_vib=vibOn;},[vibOn]);
  useEffect(()=>{localStorage.setItem("petct-lang",langId);},[langId]);

  // Dados consolidados para o relatório PDF (mesmo cálculo que alimentava o Dashboard)
  const pdfData=useMemo(()=>{
    const t12=getT12(cfg.farmaco,cfg.mvCustom);
    const perda=parseFloat(cfg.perda)||4;
    const acN=parseFloat(cfg.aCalib)||0;
    const {lista:lc,atvFinal}=recalc(lista,cfg.aCalib,cfg.vCalib,cfg.hCalib,t12,perda,parseFloat(cfg.fMin)||0.08,parseFloat(cfg.fMax)||0.12);
    const totReal=lc.reduce((s,p)=>s+p.doseAplicar,0);
    const restante=Math.max(atvFinal,0);
    const efic=acN>0?((totReal/acN)*100).toFixed(1):0;
    const pSorted=[...lc].sort((a,b)=>getRelMin(a.hSim, cfg.hCalib)-getRelMin(b.hSim, cfg.hCalib));
    return {totReal,restante,efic,pSorted};
  },[lista,cfg]);

  const [salvandoPdf,setSalvandoPdf]=useState(false);
  async function salvarPDF(){
    if(salvandoPdf) return;
    if(!lista.length){ showToast(lang.pdfNada); return; }
    setSalvandoPdf(true); vib();
    const el=document.getElementById("pra-container");
    el.style.cssText="display:block!important;position:fixed;left:-9999px;top:0;width:794px;background:#fff;padding:20px;font-family:Arial;z-index:-10";
    try{
      const cv=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
      const{jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      pdf.setProperties({title:"Registro de Operação PET-CT",subject:"Registro técnico para arquivo e auditoria",creator:"PET-CT Dose Pro"});
      const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),mg=8;
      const iw=pw-mg*2,ih=(cv.height*iw)/cv.width;
      if(ih<=ph-mg*2){pdf.addImage(cv.toDataURL("image/jpeg",1.0),"JPEG",mg,mg,iw,ih);}
      else{let r=ih,sy=0;while(r>0){const sh=Math.min(r,ph-mg*2),sc=document.createElement("canvas");sc.width=cv.width;sc.height=sh*(cv.width/iw);sc.getContext("2d").drawImage(cv,0,sy*(cv.width/iw),cv.width,sh*(cv.width/iw),0,0,cv.width,sh*(cv.width/iw));if(sy>0)pdf.addPage();pdf.addImage(sc.toDataURL("image/jpeg",1.0),"JPEG",mg,mg,iw,sh);sy+=sh;r-=sh;}}
      const totalPaginas=pdf.getNumberOfPages();
      for(let pagina=1;pagina<=totalPaginas;pagina++){pdf.setPage(pagina);pdf.setTextColor(0,0,0);pdf.setFontSize(7);pdf.text(`${pagina}/${totalPaginas}`,pw/2,ph-3,{align:"center"});}
      const instante=new Date(); const padArq=n=>String(n).padStart(2,"0");
      const dataArq=`${instante.getFullYear()}-${padArq(instante.getMonth()+1)}-${padArq(instante.getDate())}`;
      const horaArq=`${padArq(instante.getHours())}${padArq(instante.getMinutes())}${padArq(instante.getSeconds())}`;
      const loteArq=String(cfg.lote||"sem-lote").trim().replace(/[^a-zA-Z0-9_-]+/g,"-");
      pdf.save(`PETCT_${loteArq}_${dataArq}_${horaArq}.pdf`);
      showToast(lang.pdfSalvo);
    }catch(e){showToast(lang.pdfErro);}
    finally{el.style.cssText="display:none";setSalvandoPdf(false);}
  }


  const prevHCalib = useRef(cfg.hCalib);
  const prevIntervalo = useRef(cfg.intervalo);
  const prevFMin = useRef(cfg.fMin);
  const prevFMax = useRef(cfg.fMax);

  useEffect(() => {
    const hCalibChanged = cfg.hCalib && prevHCalib.current !== cfg.hCalib;
    const intervaloChanged = cfg.intervalo && prevIntervalo.current !== cfg.intervalo;
    const fMinChanged = cfg.fMin !== prevFMin.current;
    const fMaxChanged = cfg.fMax !== prevFMax.current;

    if (hCalibChanged || intervaloChanged || fMinChanged || fMaxChanged) {
      if(hCalibChanged){
        const conflito=doseRegistradaAntesDe(lista,prevHCalib.current||cfg.hCalib,cfg.hCalib);
        if(conflito){
          const hAnterior=prevHCalib.current;
          showToast(<>{ICONS.alert} {lang.calibDepoisDeDose.replace("{c}",cfg.hCalib).replace("{h}",horaInjecaoEfetiva(conflito))}</>);
          setCfg(prev=>({...prev,hCalib:hAnterior}));
          return;
        }
      }

      setLista(prevLista => {
        let novaLista = [...prevLista];
        let modificou = false;

        if (hCalibChanged || intervaloChanged) {
          novaLista=redistribuirAposCalibracao(prevLista,prevHCalib.current,cfg.hCalib,cfg.intervalo);
          modificou=novaLista.some(p=>prevLista.indexOf(p)===-1);
        }

        if (fMinChanged || fMaxChanged) {
          novaLista = novaLista.map(p => {
            if (p.fMin !== cfg.fMin || p.fMax !== cfg.fMax) {
              modificou = true;
              return { ...p, fMin: cfg.fMin, fMax: cfg.fMax };
            }
            return p;
          });
        }

        return modificou ? novaLista : prevLista;
      });

      prevHCalib.current = cfg.hCalib;
      prevIntervalo.current = cfg.intervalo;
      prevFMin.current = cfg.fMin;
      prevFMax.current = cfg.fMax;
    }
  }, [cfg.hCalib, cfg.intervalo, cfg.fMin, cfg.fMax, lista]);

  useEffect(()=>{
    localStorage.setItem("petct-ui-mode",uiMode);
    if(uiMode==="table") setTab("main");
    else if(tab==="main") setTab("lote");
  },[uiMode]);

  const NAV=[{id:"lote",label:lang.navLote,icon:ICONS.lote},{id:"lista",label:lang.navOperacao,icon:ICONS.lista,badge:lista.length||null},{id:"calc",label:lang.navCalc,icon:ICONS.calc}];

  return <>
    <BarraAtualizacao lang={lang}/>
    <div className={`toast${toast?" on":""}`}>{toast}</div>
    <Menu open={menu} onClose={()=>setMenu(false)} uiMode={uiMode} setUiMode={setUiMode} cfg={cfg} setCfg={setCfg} cor={cor} setCor={setCor} dark={dark} toggleDark={()=>setDark(!dark)} vibOn={vibOn} setVibOn={setVibOn} lang={lang} setLang={setLangId}/>
    
    {uiMode === "table" ? (
      <TelaPrincipal cfg={cfg} setCfg={setCfg} lista={lista} setLista={setLista} cor={cor} onSalvar={salvarPDF} salvandoPdf={salvandoPdf} onCalc={()=>setTab("calc")} onLimpar={()=>{setLista([]);setCfg(p=>({...p,aCalib:"",vCalib:"",hCalib:"09:00",lote:""}));}} setMenuOpen={setMenu} showToast={showToast} lang={lang}/>
    ) : (
      <>
        <TelaLote cfg={cfg} setCfg={setCfg} cor={cor} ativa={tab==="lote"&&!novo} onLimpar={()=>{setLista([]);setCfg(p=>({...p,aCalib:"",vCalib:"",hCalib:"09:00",lote:""}));setTab("lote");}} setMenuOpen={setMenu} showToast={showToast} lang={lang}/>
        <TelaLista cfg={cfg} setCfg={setCfg} lista={lista} setLista={setLista} cor={cor} onNovo={()=>setNovo(true)} onSalvar={salvarPDF} salvandoPdf={salvandoPdf} ativa={tab==="lista"&&!novo} showToast={showToast} onIrLote={()=>setTab("lote")} lang={lang}/>
        <TelaNovo cfg={cfg} lista={lista} onAdd={p=>{setLista(v=>[...v,p]);setNovo(false);setTab("lista");}} onBack={()=>setNovo(false)} cor={cor} ativa={novo} showToast={showToast} lang={lang}/>
        {!novo&&tab!=="dash"&&tab!=="calc"&&<nav className="nav">
          {NAV.map(({id,label,icon,badge})=>(
            <button key={id} className={`nav-btn${tab===id?" on":""}`} onClick={()=>{vib();setTab(id);}}>
              {badge!=null&&<span className="nav-badge">{badge}</span>}
              <span className="nav-icon">{icon}</span>
              <span>{label}</span>
            </button>
          ))}
        </nav>}
      </>
    )}

    {tab==="calc" && <TelaCalc cor={cor} ativa={true} onFechar={()=>setTab(uiMode==="table"?"main":"lista")} lang={lang}/>}

    {/* Container oculto usado para gerar o PDF diretamente (sem tela de dashboard) */}
    <div id="pra-container" style={{display:'none'}}><PrintPDF cfg={cfg} lista={pdfData.pSorted} totReal={pdfData.totReal} restante={pdfData.restante} efic={pdfData.efic} cor={cor} lang={lang}/></div>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
